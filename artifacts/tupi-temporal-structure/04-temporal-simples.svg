<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" rx="44" fill="#f7f1e5"/>
  <rect x="48" y="48" width="984" height="984" rx="34" fill="#fffdf8" stroke="#183b3a" stroke-width="3"/>
  <text x="540" y="112" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="29" letter-spacing="4" fill="#b25d3b">4 · TEMPORAL SIMPLES</text>
  <text x="540" y="194" text-anchor="middle" font-family="Georgia, serif" font-size="62" font-weight="700" fill="#183b3a">xe îekyîeme</text>
  <text x="540" y="245" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="30" fill="#536461">“quando eu morrer / ao morrer eu”</text>
  <rect x="355" y="295" width="370" height="68" rx="18" fill="#183b3a"/>
  <text x="540" y="340" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="27" fill="#fff">oração temporal</text>
  <line x1="540" y1="363" x2="540" y2="414" stroke="#69827c" stroke-width="4"/>
  <line x1="210" y1="414" x2="870" y2="414" stroke="#69827c" stroke-width="4"/>
  <line x1="210" y1="414" x2="210" y2="470" stroke="#69827c" stroke-width="4"/>
  <line x1="540" y1="414" x2="540" y2="470" stroke="#69827c" stroke-width="4"/>
  <line x1="870" y1="414" x2="870" y2="470" stroke="#69827c" stroke-width="4"/>
  <rect x="85" y="470" width="250" height="145" rx="22" fill="#dce9e3" stroke="#183b3a" stroke-width="3"/>
  <text x="210" y="520" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#183b3a">SUJEITO</text>
  <text x="210" y="568" text-anchor="middle" font-family="Georgia, serif" font-size="39" fill="#183b3a">xe</text>
  <text x="210" y="600" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="20" fill="#536461">1ª singular</text>
  <rect x="415" y="470" width="250" height="145" rx="22" fill="#f4dfcf" stroke="#b25d3b" stroke-width="3"/>
  <text x="540" y="520" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#7d3e28">RAIZ</text>
  <text x="540" y="568" text-anchor="middle" font-family="Georgia, serif" font-size="39" fill="#7d3e28">îekyî</text>
  <text x="540" y="600" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="20" fill="#7d3e28">morrer / expirar</text>
  <rect x="745" y="470" width="250" height="145" rx="22" fill="#e8e0f2" stroke="#6f5688" stroke-width="3"/>
  <text x="870" y="520" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#513d66">SUFIXO</text>
  <text x="870" y="568" text-anchor="middle" font-family="Georgia, serif" font-size="39" fill="#513d66">-eme</text>
  <text x="870" y="600" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="20" fill="#513d66">conjuntivo temporal</text>
  <rect x="118" y="704" width="844" height="180" rx="24" fill="#fff4d9" stroke="#d4a43c" stroke-width="3"/>
  <text x="540" y="751" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#6f5317">FORMA E EVENTO</text>
  <text x="540" y="800" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="24" fill="#4b4639">O evento aparece sem o enquadramento posicional durativo.</text>
  <text x="540" y="842" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="22" fill="#4b4639">Atestação citada: Xe îekyîme (Anch., Poemas, 102);</text>
  <text x="540" y="874" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="22" fill="#4b4639">o Pydicate atual produz xe îekyîeme.</text>
  <text x="540" y="972" text-anchor="middle" font-family="Menlo, monospace" font-size="23" fill="#536461">eme * (îekyî * ixé)</text>
</svg>
